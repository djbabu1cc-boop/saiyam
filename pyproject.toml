[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "1.0.0"
description = "Batch-extract invoice fields (Invoice No, Date, Vendor, GSTIN, Taxable, CGST, SGST, IGST, Total) from PDF & image invoices and export to Excel"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "djbabu1cc-boop" }]
keywords = ["invoice", "ocr", "gst", "pdf", "excel", "extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "pypdf>=4.2.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "rapidocr-onnxruntime>=1.3.0,<2",
    "onnxruntime>=1.16.0",
    "pytesseract>=0.3.10",
    "openpyxl>=3.1.2",
]

[project.scripts]
invoice-extractor = "invoice_extractor.__main__:main"

[tool.setuptools]
packages = ["invoice_extractor"]
